<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auto Bodyworx Workshop</title>
<style>
body { margin:0; padding:0; background:#0a0a0f; color:#f0f0f8; font-family:Arial,sans-serif; overflow:hidden; height:100vh; }
.header { display:flex; align-items:center; justify-content:space-between; padding:14px 36px; border-bottom:1px solid #2a2a3a; background:#12121a; }
.logo { font-size:26px; font-weight:900; color:#e8c547; letter-spacing:3px; }
.logo span { color:#f0f0f8; }
.clock-wrap { text-align:center; }
.time { font-size:52px; font-weight:900; color:#e8c547; letter-spacing:4px; line-height:1; }
.datestr { font-size:13px; color:#6b6b8a; margin-top:3px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80; margin-left:6px; }
.main { display:table; width:100%; height:calc(100vh - 97px); table-layout:fixed; }
.col { display:table-cell; border-right:1px solid #2a2a3a; vertical-align:top; overflow:hidden; }
.col:last-child { border-right:none; }
.tech-hd { padding:14px 22px; border-bottom:1px solid #2a2a3a; background:#12121a; }
.tech-name { font-size:26px; font-weight:900; letter-spacing:2px; line-height:1; }
.tech-clk { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:4px; display:inline-block; }
.clk-in { background:#16532d; color:#4ade80; }
.clk-out { background:#1c1c2e; color:#6b6b8a; }
.day-hd { font-size:9px; font-weight:700; letter-spacing:2px; color:#6b6b8a; padding:7px 22px 5px; background:#1a1a26; border-bottom:1px solid #2a2a3a; text-transform:uppercase; }
.day-hd2 { background:#12121a; }
.jobs { overflow-y:auto; }
.tmrw { border-top:2px solid #3a3a52; }
.tmrw .jobs { max-height:200px; overflow-y:auto; }
.job { padding:11px 22px 9px 25px; border-bottom:1px solid #2a2a3a; position:relative; }
.job-bar { position:absolute; left:0; top:0; bottom:0; width:3px; }
.jtime { font-size:19px; font-weight:900; color:#e8c547; letter-spacing:1px; }
.jtime-tbc { font-size:11px; color:#6b6b8a; font-style:italic; }
.jname { font-size:15px; font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.jname-done { text-decoration:line-through; color:#6b6b8a; }
.jveh { font-size:11px; color:#6b6b8a; margin-top:1px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.jdur { font-size:11px; color:#e8c547; font-weight:700; margin-top:3px; }
.tags { margin-top:4px; }
.tag { display:inline-block; font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; margin-right:3px; text-transform:uppercase; letter-spacing:.5px; }
.tag-mob { background:#1e3a5f; color:#4a9eff; }
.tag-ws  { background:#3a2200; color:#fb923c; }
.tag-done{ background:#14532d; color:#4ade80; }
.tag-late{ background:#3a1212; color:#f87171; }
.tag-cd  { background:#2a1a3a; color:#a78bfa; }
.tag-day { background:#0d2a2a; color:#2dd4bf; }
.empty { padding:20px 22px; font-size:13px; color:#6b6b8a; font-style:italic; }
.err { position:fixed; bottom:16px; right:16px; background:#3a1212; border:1px solid #f87171; color:#f87171; padding:10px 16px; border-radius:6px; font-size:13px; display:none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Auto <span>Bodyworx</span></div>
  <div class="clock-wrap">
    <div class="time" id="timeEl">--:--:--</div>
    <div class="datestr" id="dateEl"></div>
  </div>
  <div style="text-align:right;font-size:12px;color:#6b6b8a">
    Workshop Dashboard<span class="dot"></span><br>
    <span id="updEl" style="font-size:11px">Loading...</span>
  </div>
</div>

<div class="main" id="main">
  <div class="col" style="display:table-cell;text-align:center;vertical-align:middle;color:#6b6b8a;font-size:16px" colspan="3">
    Connecting to PanelPro...
  </div>
</div>

<div class="err" id="errEl"></div>

<script>
var TECHS = [
  {name:'Shaun',   col:'S', color:'#4a9eff', bg:'#1e2d4a'},
  {name:'Tony',    col:'T', color:'#a78bfa', bg:'#2d1f4a'},
  {name:'Charles', col:'C', color:'#fb923c', bg:'#3a2010'}
];

var DIARY = ['Holiday','Appointment','Van day','Diary entry','Bank Holiday'];

function pad(n) { return n < 10 ? '0'+n : ''+n; }

function dateStr(offset) {
  var d = new Date();
  d.setDate(d.getDate() + (offset || 0));
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

function fmtDate(s) {
  if (!s) return '';
  var d = new Date(s + 'T12:00:00');
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function fmtTime(t) {
  if (!t) return null;
  var parts = t.split(':');
  var h = parseInt(parts[0]);
  var m = parts[1];
  var s = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12 || 12;
  return h12 + ':' + m + ' ' + s;
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseDays(j) {
  var days = j.duration_days || 1;
  if (days <= 1 && j.duration) {
    var m = j.duration.match(/(\d+)\s*day/i);
    if (m) days = parseInt(m[1]);
  }
  return days;
}

function jobSpansDate(j, ds) {
  if (!j.booking_date) return false;
  var days = parseDays(j);
  if (days <= 1) return j.booking_date === ds;
  var start = new Date(j.booking_date + 'T12:00:00').getTime();
  var check = new Date(ds + 'T12:00:00').getTime();
  var end = start + (days - 1) * 86400000;
  return check >= start && check <= end;
}

function belongs(assigned, col) {
  if (!assigned) return col === 'S';
  var t = assigned.toLowerCase();
  if (t.indexOf('both') > -1) return true;
  if (col === 'S') return t.indexOf('shaun') > -1 || (t.indexOf('tony') === -1 && t.indexOf('charles') === -1);
  if (col === 'T') return t.indexOf('tony') > -1;
  if (col === 'C') return t.indexOf('charles') > -1;
  return false;
}

function buildCard(j, ds) {
  var today = dateStr(0);
  var isDone = j.status === 'completed';
  var isDiary = DIARY.indexOf(j.source) > -1;
  var isMobile = j.job_location === 'mobile';
  var days = parseDays(j);
  var isMulti = days > 1;
  var now = new Date();
  var nowTime = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var isOverdue = j.status === 'booked' && ds === today && j.booking_time && j.booking_time < nowTime;

  var barColor = '#fb923c';
  if (isDone) barColor = '#4ade80';
  else if (isOverdue) barColor = '#f87171';
  else if (isMulti) barColor = '#2dd4bf';
  else if (isDiary) barColor = '#3a3a52';
  else if (isMobile) barColor = '#4a9eff';

  var nameClass = isDone ? 'jname jname-done' : 'jname';
  var timeHtml = j.booking_time
    ? '<div class="jtime">' + fmtTime(j.booking_time) + '</div>'
    : '<div class="jtime-tbc">Time TBC</div>';

  var dur = '';
  if (isMulti) {
    var startMs = new Date(j.booking_date + 'T12:00:00').getTime();
    var checkMs = new Date(ds + 'T12:00:00').getTime();
    var dayNum = Math.round((checkMs - startMs) / 86400000) + 1;
    dur = '<div class="jdur">Day ' + dayNum + ' of ' + days + '</div>';
  } else if (j.duration) {
    dur = '<div class="jdur">&#9201; ' + esc(j.duration) + '</div>';
  }

  var tags = '';
  if (isDone) tags += '<span class="tag tag-done">Complete</span>';
  if (isOverdue) tags += '<span class="tag tag-late">Overdue</span>';
  if (!isDiary && !isDone && !isOverdue && !isMulti) {
    tags += isMobile
      ? '<span class="tag tag-mob">Mobile</span>'
      : '<span class="tag tag-ws">Workshop</span>';
  }
  if (j.cd_required) tags += '<span class="tag tag-cd">C&amp;D</span>';
  if (isMulti && !isDone) tags += '<span class="tag tag-day">' + days + '-day job</span>';

  return '<div class="job">'
    + '<div class="job-bar" style="background:' + barColor + '"></div>'
    + timeHtml
    + '<div class="' + nameClass + '">' + esc(j.customer_name || 'Unknown') + '</div>'
    + '<div class="jveh">' + esc(j.vehicle || '&mdash;') + (j.panels ? ' &middot; ' + esc(j.panels) : '') + '</div>'
    + dur
    + (tags ? '<div class="tags">' + tags + '</div>' : '')
    + '</div>';
}

function sortJobs(arr) {
  return arr.slice().sort(function(a, b) {
    var ta = a.booking_time || '99:99';
    var tb = b.booking_time || '99:99';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
}

function buildCol(tech, jobs, entries, today, tmrw) {
  var todayJobs = sortJobs(jobs.filter(function(j) {
    return jobSpansDate(j, today) && belongs(j.assigned_tech, tech.col);
  }));
  var tmrwJobs = sortJobs(jobs.filter(function(j) {
    return jobSpansDate(j, tmrw) && belongs(j.assigned_tech, tech.col);
  }));

  var entry = null;
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].tech_name === tech.name) { entry = entries[i]; break; }
  }
  var clkClass = entry && entry.clock_in && !entry.clock_out ? 'tech-clk clk-in' : 'tech-clk clk-out';
  var clkText = entry && entry.clock_in && !entry.clock_out
    ? 'Clocked in ' + entry.clock_in
    : entry && entry.clock_out ? 'Out at ' + entry.clock_out : 'Not clocked in';

  var todayHtml = todayJobs.length
    ? todayJobs.map(function(j){ return buildCard(j, today); }).join('')
    : '<div class="empty">Nothing booked today</div>';

  var tmrwHtml = tmrwJobs.length
    ? tmrwJobs.map(function(j){ return buildCard(j, tmrw); }).join('')
    : '<div class="empty">Nothing booked yet</div>';

  var h = 'calc(100vh - 97px - 36px - 36px - 36px - 36px - 2px)';

  return '<div class="col">'
    + '<div class="tech-hd">'
    + '<div class="tech-name" style="color:' + tech.color + '">' + tech.name + '</div>'
    + '<span class="' + clkClass + '">' + clkText + '</span>'
    + '</div>'
    + '<div class="day-hd">TODAY &mdash; ' + fmtDate(today) + '</div>'
    + '<div class="jobs" style="max-height:' + h + ';overflow-y:auto">' + todayHtml + '</div>'
    + '<div class="tmrw">'
    + '<div class="day-hd day-hd2">TOMORROW &mdash; ' + fmtDate(tmrw) + '</div>'
    + '<div class="jobs" style="max-height:200px;overflow-y:auto">' + tmrwHtml + '</div>'
    + '</div>'
    + '</div>';
}

// Clock
function tick() {
  var now = new Date();
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('timeEl').innerHTML = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  document.getElementById('dateEl').innerHTML = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
}
setInterval(tick, 1000);
tick();

// Data fetch using old XMLHttpRequest
function refresh() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/.netlify/functions/dashboard-data', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      if (xhr.status !== 200) throw new Error('Error ' + xhr.status);
      var data = JSON.parse(xhr.responseText);
      var jobs = data.jobs || [];
      var entries = data.entries || [];
      var today = data.today || dateStr(0);
      var tmrw = data.tmrw || dateStr(1);

      var html = '';
      for (var i = 0; i < TECHS.length; i++) {
        html += buildCol(TECHS[i], jobs, entries, today, tmrw);
      }
      document.getElementById('main').innerHTML = html;

      var now = new Date();
      document.getElementById('updEl').innerHTML = 'Updated ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.getElementById('errEl').style.display = 'none';
    } catch(e) {
      document.getElementById('errEl').innerHTML = 'Error: ' + e.message;
      document.getElementById('errEl').style.display = 'block';
    }
  };
  xhr.onerror = function() {
    document.getElementById('errEl').innerHTML = 'Connection failed';
    document.getElementById('errEl').style.display = 'block';
  };
  xhr.send();
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
