<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auto Bodyworx Workshop</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0f; color:#f0f0f8; font-family:Arial,sans-serif; overflow:hidden; height:100vh; width:100vw; }

/* ── HEADER ─────────────────────────────────────────────── */
.hdr { display:flex; align-items:center; width:100%; background:#12121a; border-bottom:2px solid #2a2a3a; height:90px; position:relative; }
.hdr-cell { padding:0 36px; flex:1; }
.hdr-center { position:absolute; left:50%; transform:translateX(-50%); text-align:center; }
.logo { font-size:28px; font-weight:900; color:#e8c547; letter-spacing:4px; }
.logo span { color:#f0f0f8; }
.tagline { font-size:11px; color:#6b6b8a; letter-spacing:3px; margin-top:3px; text-transform:uppercase; }
.time { font-size:56px; font-weight:900; color:#e8c547; letter-spacing:4px; line-height:1; }
.datestr { font-size:14px; color:#9090b0; margin-top:4px; letter-spacing:1px; }
.hdr-right { text-align:right; }
.live-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#4ade80; margin-right:6px; }
.upd-lbl { font-size:12px; color:#6b6b8a; margin-top:6px; }

/* ── BODY GRID ───────────────────────────────────────────── */
/* 3 rows (day headers) × 3 cols (techs) */
.body { display:table; width:100%; height:calc(100vh - 90px); table-layout:fixed; }

/* ── DAY COLUMN (each tech) ─────────────────────────────── */
.day-col { display:table-cell; border-right:1px solid #2a2a3a; vertical-align:top; }
.day-col:last-child { border-right:none; }

/* ── TECH HEADER ─────────────────────────────────────────── */
.tech-hd { background:#14141e; border-bottom:2px solid #2a2a3a; padding:12px 20px; display:table; width:100%; }
.tech-av { display:table-cell; vertical-align:middle; width:52px; }
.tech-av-inner { width:48px; height:48px; border-radius:50%; display:table-cell; vertical-align:middle; text-align:center; font-size:22px; font-weight:900; }
.tech-info { display:table-cell; vertical-align:middle; padding-left:12px; }
.tech-name { font-size:26px; font-weight:900; letter-spacing:2px; line-height:1.1; }
.tech-clk { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-top:5px; display:inline-block; }
.clk-in { background:#16532d; color:#4ade80; }
.clk-out { background:#1c1c2e; color:#6b6b8a; }

/* ── DAY SECTIONS ────────────────────────────────────────── */
.day-sections { display:table; width:100%; height:calc(100vh - 90px - 74px); table-layout:fixed; }
.day-sec { display:table-cell; border-right:1px solid #1e1e2e; border-top:1px solid #2a2a3a; vertical-align:top; overflow:hidden; }
.day-sec:last-child { border-right:none; }
.day-hd-bar { background:#1a1a28; border-bottom:1px solid #2a2a3a; padding:6px 16px; }
.day-hd-lbl { font-size:9px; font-weight:700; letter-spacing:2.5px; color:#6b6b8a; text-transform:uppercase; }
.day-hd-date { font-size:13px; font-weight:700; color:#9090b0; margin-top:1px; }
.day-hd-bar.today-bar { background:#1a2a1a; }
.day-hd-bar.today-bar .day-hd-lbl { color:#4ade80; }
.day-hd-bar.today-bar .day-hd-date { color:#4ade80; }

.jobs-wrap { overflow-y:auto; height:calc(100% - 47px); }

/* ── JOB CARD ────────────────────────────────────────────── */
.job { padding:10px 16px 9px 19px; border-bottom:1px solid #1a1a28; position:relative; }
.jbar { position:absolute; left:0; top:0; bottom:0; width:3px; }
.jtime { font-size:18px; font-weight:900; color:#e8c547; letter-spacing:1px; line-height:1; }
.jtime-tbc { font-size:11px; color:#6b6b8a; font-style:italic; }
.jname { font-size:15px; font-weight:700; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; margin-top:1px; }
.jname-done { text-decoration:line-through; color:#6b6b8a; }
.jveh { font-size:11px; color:#6b6b8a; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; margin-top:1px; }
.jpanels { font-size:13px; color:#c0c0d8; font-weight:600; margin-top:3px; }
.jnotes { font-size:12px; color:#9090b0; margin-top:4px; line-height:1.4; background:#16162a; padding:5px 8px; border-radius:4px; border-left:2px solid #3a3a52; }
.jdur { font-size:11px; color:#e8c547; font-weight:700; margin-top:3px; }
.tags { margin-top:4px; }
.tag { display:inline-block; font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; margin-right:3px; text-transform:uppercase; letter-spacing:.4px; }
.t-mob  { background:#1e3a5f; color:#4a9eff; }
.t-ws   { background:#3a2200; color:#fb923c; }
.t-done { background:#14532d; color:#4ade80; }
.t-late { background:#3a1212; color:#f87171; }
.t-cd   { background:#2a1a3a; color:#a78bfa; }
.t-mul  { background:#0d2a2a; color:#2dd4bf; }
.empty  { padding:16px; font-size:12px; color:#3a3a52; font-style:italic; }
.err { position:fixed; bottom:14px; right:14px; background:#3a1212; border:1px solid #f87171; color:#f87171; padding:8px 14px; border-radius:6px; font-size:12px; display:none; z-index:99; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-cell">
    <div class="logo">Auto <span>Bodyworx</span></div>
    <div class="tagline">Workshop Dashboard</div>
  </div>
  <div class="hdr-cell hdr-center">
    <div class="time" id="timeEl">--:--:--</div>
    <div class="datestr" id="dateEl"></div>
  </div>
  <div class="hdr-cell hdr-right">
    <div><span class="live-dot"></span><span style="font-size:13px;color:#9090b0;font-weight:700">LIVE</span></div>
    <div class="upd-lbl" id="updEl">Connecting...</div>
  </div>
</div>

<div class="body" id="bodyEl">
  <div class="day-col" style="text-align:center;vertical-align:middle;color:#3a3a52;font-size:18px;display:table-cell" colspan="3">
    Loading...
  </div>
</div>

<div class="err" id="errEl"></div>

<script>
var TECHS = [
  {name:'Shaun',   col:'S', color:'#4a9eff', bg:'#1e2d4a'},
  {name:'Tony',    col:'T', color:'#a78bfa', bg:'#2d1f4a'},
  {name:'Charles', col:'C', color:'#fb923c', bg:'#3a2010'}
];
var DIARY = ['Holiday','Appointment','Van day','Diary entry','Bank Holiday'];
var DAYS_SHOWN = 3; // Today + 2 more days

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function dateStr(offset) {
  var d = new Date();
  d.setDate(d.getDate() + (offset || 0));
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function fmtDateShort(s) {
  if (!s) return '';
  var d = new Date(s + 'T12:00:00');
  var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function fmtDateFull(s) {
  if (!s) return '';
  var d = new Date(s + 'T12:00:00');
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getDay()] + ' ' + d.getDate() + ' ' + months[d.getMonth()];
}

function fmtTime(t) {
  if (!t) return null;
  var parts = t.split(':');
  var h = parseInt(parts[0]);
  var m = parts[1];
  return (h % 12 || 12) + ':' + m + ' ' + (h >= 12 ? 'PM' : 'AM');
}

function esc(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseDays(j) {
  var days = j.duration_days || 1;
  if (days <= 1 && j.duration) {
    var m = j.duration.match(/(\d+)\s*day/i);
    if (m) days = parseInt(m[1]);
  }
  return days;
}

function jobSpansDate(j, ds) {
  if (!j.booking_date) return false;
  var days = parseDays(j);
  if (days <= 1) return j.booking_date === ds;
  var start = new Date(j.booking_date + 'T12:00:00').getTime();
  var check = new Date(ds + 'T12:00:00').getTime();
  var end = start + (days - 1) * 86400000;
  return check >= start && check <= end;
}

function belongs(assigned, col) {
  if (!assigned) return col === 'S';
  var t = assigned.toLowerCase();
  if (t.indexOf('both') > -1) return true;
  if (col === 'S') return t.indexOf('shaun') > -1 || (t.indexOf('tony') === -1 && t.indexOf('charles') === -1);
  if (col === 'T') return t.indexOf('tony') > -1;
  if (col === 'C') return t.indexOf('charles') > -1;
  return false;
}

function buildCard(j, ds) {
  var today = dateStr(0);
  var isDone = j.status === 'completed';
  var isDiary = DIARY.indexOf(j.source) > -1;
  var isMobile = j.job_location === 'mobile';
  var days = parseDays(j);
  var isMulti = days > 1;
  var now = new Date();
  var nowTime = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var isOverdue = j.status === 'booked' && ds === today && j.booking_time && j.booking_time < nowTime;

  var barColor = '#fb923c';
  if (isDone)      barColor = '#4ade80';
  else if (isOverdue) barColor = '#f87171';
  else if (isMulti)   barColor = '#2dd4bf';
  else if (isDiary)   barColor = '#3a3a52';
  else if (isMobile)  barColor = '#4a9eff';

  var timeHtml = j.booking_time
    ? '<div class="jtime">' + fmtTime(j.booking_time) + '</div>'
    : '<div class="jtime-tbc">Time TBC</div>';

  var dur = '';
  if (isMulti) {
    var dayNum = Math.round((new Date(ds + 'T12:00:00').getTime() - new Date(j.booking_date + 'T12:00:00').getTime()) / 86400000) + 1;
    dur = '<div class="jdur">Day ' + dayNum + ' / ' + days + '</div>';
  } else if (j.duration) {
    dur = '<div class="jdur">&#9201; ' + esc(j.duration) + '</div>';
  }

  var tags = '';
  if (isDone)    tags += '<span class="tag t-done">&#10003; Done</span>';
  if (isOverdue) tags += '<span class="tag t-late">&#9888; Late</span>';
  if (!isDiary && !isDone && !isOverdue && !isMulti) {
    tags += isMobile ? '<span class="tag t-mob">&#128658; Mobile</span>' : '<span class="tag t-ws">Workshop</span>';
  }
  if (j.cd_required) tags += '<span class="tag t-cd">C&amp;D</span>';
  if (isMulti && !isDone) tags += '<span class="tag t-mul">' + days + '-day</span>';

  var nameClass = isDone ? 'jname jname-done' : 'jname';

  // Panels work
  var panelsHtml = j.panels ? '<div class="jpanels">' + esc(j.panels) + '</div>' : '';

  // Notes — show full text
  var notesHtml = j.notes ? '<div class="jnotes">' + esc(j.notes) + '</div>' : '';

  return '<div class="job">'
    + '<div class="jbar" style="background:' + barColor + '"></div>'
    + timeHtml
    + '<div class="' + nameClass + '">' + esc(j.customer_name || 'Unknown') + '</div>'
    + '<div class="jveh">' + esc(j.vehicle || '') + '</div>'
    + panelsHtml
    + dur
    + notesHtml
    + (tags ? '<div class="tags">' + tags + '</div>' : '')
    + '</div>';
}

function sortJobs(arr) {
  return arr.slice().sort(function(a, b) {
    var ta = a.booking_time || '99:99';
    var tb = b.booking_time || '99:99';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
}

function buildDaySection(j_all, ds, isToday, tech) {
  var jobs = sortJobs(j_all.filter(function(j) {
    return jobSpansDate(j, ds) && belongs(j.assigned_tech, tech.col);
  }));

  var hdrClass = isToday ? 'day-hd-bar today-bar' : 'day-hd-bar';
  var lbl = isToday ? 'TODAY' : (ds === dateStr(1) ? 'TOMORROW' : 'IN 2 DAYS');

  var jobsHtml = jobs.length
    ? jobs.map(function(j) { return buildCard(j, ds); }).join('')
    : '<div class="empty">Nothing booked</div>';

  return '<div class="day-sec">'
    + '<div class="' + hdrClass + '">'
    + '<div class="day-hd-lbl">' + lbl + '</div>'
    + '<div class="day-hd-date">' + fmtDateShort(ds) + '</div>'
    + '</div>'
    + '<div class="jobs-wrap">' + jobsHtml + '</div>'
    + '</div>';
}

function buildTechCol(jobs, entries, tech) {
  var entry = null;
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].tech_name === tech.name) { entry = entries[i]; break; }
  }
  var clkClass = entry && entry.clock_in && !entry.clock_out ? 'tech-clk clk-in' : 'tech-clk clk-out';
  var clkText = entry && entry.clock_in && !entry.clock_out
    ? '&#9679; In since ' + entry.clock_in
    : entry && entry.clock_out ? '&#9679; Out ' + entry.clock_out : '&#9675; Not clocked in';

  var daySections = '';
  for (var d = 0; d < DAYS_SHOWN; d++) {
    var ds = dateStr(d);
    daySections += buildDaySection(jobs, ds, d === 0, tech);
  }

  return '<div class="day-col">'
    + '<div class="tech-hd">'
    + '<div class="tech-av"><div class="tech-av-inner" style="background:' + tech.bg + ';color:' + tech.color + '">' + tech.name[0] + '</div></div>'
    + '<div class="tech-info"><div class="tech-name" style="color:' + tech.color + '">' + tech.name + '</div>'
    + '<span class="' + clkClass + '">' + clkText + '</span></div>'
    + '</div>'
    + '<div class="day-sections" style="display:table;width:100%;table-layout:fixed;height:calc(100vh - 90px - 74px)">'
    + daySections
    + '</div>'
    + '</div>';
}

// Clock
function tick() {
  var now = new Date();
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('timeEl').innerHTML = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  document.getElementById('dateEl').innerHTML = DAYS[now.getDay()] + ' ' + now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + now.getFullYear();
}
setInterval(tick, 1000);
tick();

// Fetch
function refresh() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/.netlify/functions/dashboard-data', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    try {
      if (xhr.status !== 200) throw new Error('Server error ' + xhr.status);
      var data = JSON.parse(xhr.responseText);
      var jobs = data.jobs || [];
      var entries = data.entries || [];
      var html = '';
      for (var i = 0; i < TECHS.length; i++) {
        html += buildTechCol(jobs, entries, TECHS[i]);
      }
      document.getElementById('bodyEl').innerHTML = html;
      var now = new Date();
      document.getElementById('updEl').innerHTML = 'Updated ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      document.getElementById('errEl').style.display = 'none';
    } catch(e) {
      document.getElementById('errEl').innerHTML = 'Error: ' + e.message;
      document.getElementById('errEl').style.display = 'block';
    }
  };
  xhr.onerror = function() {
    document.getElementById('errEl').innerHTML = 'Connection failed';
    document.getElementById('errEl').style.display = 'block';
  };
  xhr.send();
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
