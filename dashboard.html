<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Auto Bodyworx — Workshop Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26; --border:#2a2a3a;
    --accent:#e8c547; --blue:#4a9eff; --teal:#2dd4bf; --tony:#a78bfa;
    --amber:#fb923c; --red:#f87171; --green:#4ade80; --txt:#f0f0f8; --muted:#6b6b8a; --dim:#3a3a52;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--txt); overflow:hidden; }

  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 40px; border-bottom:1px solid var(--border); background:var(--surface); }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:3px; color:var(--accent); }
  .logo span { color:var(--txt); }
  .time-big { font-family:'Bebas Neue',sans-serif; font-size:52px; letter-spacing:4px; color:var(--accent); line-height:1; text-align:center; }
  .date-lbl { font-size:13px; color:var(--muted); text-align:center; margin-top:2px; letter-spacing:.5px; }
  .refresh-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-left:6px; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

  .main { display:grid; grid-template-columns:1fr 1fr 1fr; height:calc(100vh - 101px); }
  .tech-col { border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .tech-col:last-child { border-right:none; }

  .tech-header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; flex-shrink:0; background:var(--surface); }
  .tech-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:22px; flex-shrink:0; }
  .tech-name { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; line-height:1; }
  .tech-clock { font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; margin-top:4px; display:inline-block; letter-spacing:.4px; }
  .clk-in  { background:#16532d; color:#4ade80; }
  .clk-out { background:#1c1c2e; color:var(--muted); }

  .day-hd { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:2.5px; color:var(--muted); padding:8px 24px 6px; background:var(--surface2); border-bottom:1px solid var(--border); flex-shrink:0; }
  .day-hd.tmrw { background:var(--surface); }

  .jobs-scroll { overflow-y:auto; flex:1; }
  .jobs-scroll::-webkit-scrollbar { width:2px; }
  .jobs-scroll::-webkit-scrollbar-thumb { background:var(--dim); }

  .jcard { padding:12px 24px 10px 27px; border-bottom:1px solid var(--border); position:relative; }
  .jcard::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; }
  .jcard.mobile::before   { background:var(--blue); }
  .jcard.workshop::before { background:var(--amber); }
  .jcard.done::before     { background:var(--green); }
  .jcard.done             { opacity:.4; }
  .jcard.overdue::before  { background:var(--red); }
  .jcard.diary::before    { background:var(--dim); }
  .jcard.multiday::before { background:var(--teal); }

  .jtime { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--accent); }
  .jtime.tbc { font-size:11px; color:var(--muted); font-family:'DM Sans',sans-serif; font-style:italic; letter-spacing:0; line-height:2; }
  .jname { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jname.done { text-decoration:line-through; color:var(--muted); }
  .jveh { font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jdur { font-size:11px; color:var(--accent); margin-top:3px; font-weight:600; }
  .jtags { display:flex; gap:4px; margin-top:5px; flex-wrap:wrap; }
  .tag { font-size:9px; font-weight:700; padding:2px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:.5px; }
  .tag-mob    { background:#1e3a5f; color:var(--blue); }
  .tag-ws     { background:#3a2200; color:var(--amber); }
  .tag-done   { background:#14532d; color:var(--green); }
  .tag-late   { background:#3a1212; color:var(--red); }
  .tag-cd     { background:#2a1a3a; color:var(--tony); }
  .tag-diary  { background:#1a1a2e; color:var(--muted); }
  .tag-multi  { background:#0d2a2a; color:var(--teal); }

  .empty { padding:24px; font-size:13px; color:var(--muted); font-style:italic; }
  .tmrw-wrap { border-top:2px solid var(--dim); flex-shrink:0; }
  .tmrw-scroll { overflow-y:auto; max-height:210px; }

  .err-banner { position:fixed; bottom:20px; right:20px; background:#3a1212; border:1px solid var(--red); color:var(--red); padding:10px 16px; border-radius:8px; font-size:13px; display:none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Auto <span>Bodyworx</span></div>
  <div>
    <div class="time-big" id="timeLbl">--:--:--</div>
    <div class="date-lbl" id="dateLbl"></div>
  </div>
  <div style="text-align:right">
    <div style="font-size:12px;color:var(--muted)">Workshop Dashboard <span class="refresh-dot"></span></div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px" id="updLbl">Loading...</div>
  </div>
</div>

<div class="main" id="mainGrid">
  <div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted)">
    <div style="font-size:48px">⏳</div>
    <div style="font-size:16px;letter-spacing:1px">Connecting to PanelPro...</div>
  </div>
</div>

<div class="err-banner" id="errBanner"></div>

<script>
const SUPABASE_URL  = 'https://isxycoxqlummscxmdckj.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzeHljb3hxbHVtbXNjeG1kY2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMTg1MTIsImV4cCI6MjA5MDg5NDUxMn0.QU_VJ-RvHa9gxOQgKG0_ywxrny4upxE5rFwG9cNMEjw';

const TECHS = [
  { name:'Shaun',   col:'S', color:'#4a9eff', bg:'#1e2d4a' },
  { name:'Tony',    col:'T', color:'#a78bfa', bg:'#2d1f4a' },
  { name:'Charles', col:'C', color:'#fb923c', bg:'#3a2010' },
];
const DIARY_SRC = ['Holiday','Appointment','Van day','Diary entry','Bank Holiday'];

function dateStr(offset=0) {
  const d = new Date(); d.setDate(d.getDate()+offset);
  return d.toISOString().split('T')[0];
}
function fmtDate(s) {
  return new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
function fmtTime(t) {
  if (!t) return null;
  const [h,m] = t.split(':').map(Number);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseDays(j) {
  let days = j.duration_days || 1;
  if (days <= 1 && j.duration) {
    const m = j.duration.match(/(\d+)\s*day/i);
    if (m) days = parseInt(m[1]);
  }
  return days;
}

function jobSpansDate(j, ds) {
  if (!j.booking_date) return false;
  const days = parseDays(j);
  if (days <= 1) return j.booking_date === ds;
  const start = new Date(j.booking_date + 'T12:00:00');
  const check = new Date(ds + 'T12:00:00');
  const end   = new Date(start); end.setDate(start.getDate() + days - 1);
  return check >= start && check <= end;
}

function belongs(assigned, col) {
  if (!assigned) return col==='S';
  const t = assigned.toLowerCase();
  if (t.includes('both')) return true;
  if (col==='S') return t.includes('shaun') || (!t.includes('tony') && !t.includes('charles'));
  if (col==='T') return t.includes('tony');
  if (col==='C') return t.includes('charles');
  return false;
}

// Data fetched via /.netlify/functions/dashboard-data

function buildCard(j, dateForCard) {
  const today    = dateStr(0);
  const isDone   = j.status === 'completed';
  const isDiary  = DIARY_SRC.includes(j.source);
  const isMobile = j.job_location === 'mobile';
  const days     = parseDays(j);
  const isMulti  = days > 1;
  const now      = new Date().toTimeString().slice(0,5);
  const isOverdue = j.status==='booked' && dateForCard===today && j.booking_time && j.booking_time < now;

  let cls = 'jcard';
  if (isDone)      cls += ' done';
  else if (isOverdue) cls += ' overdue';
  else if (isDiary)   cls += ' diary';
  else if (isMulti)   cls += ' multiday';
  else if (isMobile)  cls += ' mobile';
  else                cls += ' workshop';

  // Day X of Y for multi-day
  let dayBadge = '';
  if (isMulti) {
    const start   = new Date(j.booking_date + 'T12:00:00');
    const check   = new Date(dateForCard + 'T12:00:00');
    const dayNum  = Math.round((check - start) / 86400000) + 1;
    dayBadge = `<span class="tag tag-multi">Day ${dayNum}/${days}</span>`;
  }

  const tags = [];
  if (isDone)      tags.push('<span class="tag tag-done">✓ Complete</span>');
  if (isOverdue)   tags.push('<span class="tag tag-late">⚠ Overdue</span>');
  if (!isDiary && !isMulti && !isDone && !isOverdue)
    tags.push(isMobile ? '<span class="tag tag-mob">🚐 Mobile</span>' : '<span class="tag tag-ws">Workshop</span>');
  if (j.cd_required) tags.push('<span class="tag tag-cd">C&D</span>');
  if (isDiary) tags.push(`<span class="tag tag-diary">${esc(j.source)}</span>`);
  if (dayBadge) tags.push(dayBadge);

  const durText = isMulti ? `${days}-day job` : (j.duration || '');

  return `<div class="${cls}">
    <div class="${j.booking_time?'jtime':'jtime tbc'}">${j.booking_time?fmtTime(j.booking_time):'Time TBC'}</div>
    <div class="jname${isDone?' done':''}">${esc(j.customer_name||'Unknown')}</div>
    <div class="jveh">${esc(j.vehicle||'—')}${j.panels?' · '+esc(j.panels):''}</div>
    ${durText?`<div class="jdur">⏱ ${esc(durText)}</div>`:''}
    ${tags.length?`<div class="jtags">${tags.join('')}</div>`:''}
  </div>`;
}

function buildCol(tech, jobs, entries, today, tmrw) {
  const sort = arr => [...arr].sort((a,b)=>(a.booking_time||'99:99').localeCompare(b.booking_time||'99:99'));
  const todayJobs = sort(jobs.filter(j => jobSpansDate(j,today) && belongs(j.assigned_tech,tech.col)));
  const tmrwJobs  = sort(jobs.filter(j => jobSpansDate(j,tmrw)  && belongs(j.assigned_tech,tech.col)));

  const entry = entries.find(e => e.tech_name===tech.name);
  const clkClass = entry?.clock_in && !entry?.clock_out ? 'clk-in' : 'clk-out';
  const clkText  = entry?.clock_in && !entry?.clock_out
    ? `🟢 Clocked in ${entry.clock_in}`
    : entry?.clock_out ? `⚫ Out at ${entry.clock_out}` : '⚫ Not clocked in';

  return `<div class="tech-col">
    <div class="tech-header">
      <div class="tech-avatar" style="background:${tech.bg};color:${tech.color}">${tech.name[0]}</div>
      <div>
        <div class="tech-name" style="color:${tech.color}">${tech.name}</div>
        <span class="tech-clock ${clkClass}">${clkText}</span>
      </div>
    </div>
    <div class="day-hd">TODAY — ${fmtDate(today)}</div>
    <div class="jobs-scroll">${todayJobs.length ? todayJobs.map(j=>buildCard(j,today)).join('') : '<div class="empty">Nothing booked today</div>'}</div>
    <div class="tmrw-wrap">
      <div class="day-hd tmrw">TOMORROW — ${fmtDate(tmrw)}</div>
      <div class="tmrw-scroll">${tmrwJobs.length ? tmrwJobs.map(j=>buildCard(j,tmrw)).join('') : '<div class="empty">Nothing booked yet</div>'}</div>
    </div>
  </div>`;
}

// Clock
function tick() {
  const now = new Date();
  document.getElementById('timeLbl').textContent = now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('dateLbl').textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,1000); tick();

function refresh() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/.netlify/functions/dashboard-data', true);
  xhr.onload = function() {
    try {
      if (xhr.status !== 200) throw new Error('Server error ' + xhr.status);
      var data = JSON.parse(xhr.responseText);
      var jobs = data.jobs, entries = data.entries, today = data.today, tmrw = data.tmrw;
      document.getElementById('mainGrid').innerHTML = TECHS.map(function(t){ return buildCol(t,jobs,entries,today,tmrw); }).join('');
      document.getElementById('updLbl').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      document.getElementById('errBanner').style.display = 'none';
    } catch(e) {
      console.error('Dashboard error:', e);
      var b = document.getElementById('errBanner');
      b.textContent = String.fromCharCode(9888) + ' ' + e.message;
      b.style.display = 'block';
    }
  };
  xhr.onerror = function() {
    var b = document.getElementById('errBanner');
    b.textContent = String.fromCharCode(9888) + ' Connection failed';
    b.style.display = 'block';
  };
  xhr.send();
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
